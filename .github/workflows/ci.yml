name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  RAILS_ENV: test

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        # Invoke Ruby explicitly: Windows-generated binstubs use ruby.exe shebangs.
        run: bundle exec ruby bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bundle exec ruby bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rails native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libsqlite3-dev sqlite3 libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bundle exec ruby bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rails native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libsqlite3-dev sqlite3 libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true

      - name: Prepare SQLite test database
        run: bundle exec rails db:prepare

      - name: Check Rails autoloading
        run: bundle exec rails zeitwerk:check

      - name: Run Minitest
        run: bundle exec rails test

  agent_postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: signflow_agent
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: signflow_agent_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U signflow_agent -d signflow_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database credentials, not an application/API secret.
      SIGNFLOW_AGENT_TEST_DATABASE_URL: postgresql://signflow_agent:local-ci-only@127.0.0.1:5432/signflow_agent_test
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libsqlite3-dev libpq-dev libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true
      - name: Apply migrations to isolated PostgreSQL test database
        run: bundle exec rails db:migrate
      - name: Agent API and concurrent database requests
        run: bundle exec rails test test/models/agent_credential_test.rb test/integration/agent_api_test.rb test/integration/agent_credentials_test.rb test/integration/agent_rate_limit_test.rb test/services/agent_rate_limiter_test.rb test/integration/llm_agent_handoff_test.rb test/postgresql/agent_concurrency_test.rb
